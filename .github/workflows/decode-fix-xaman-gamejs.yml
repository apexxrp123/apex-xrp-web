name: decode-fix-xaman-gamejs
on:
  push:
    branches: [fix-xaman-qr-links]
    paths:
      - "apex-io/_fix_b64/**"
      - ".github/workflows/decode-fix-xaman-gamejs.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-xaman-qr-links
      - name: Assemble decode and commit game.js
        run: |
          set -euo pipefail
          cat apex-io/_fix_b64/p*.txt > /tmp/game.b64
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib
          b = pathlib.Path("/tmp/game.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(b))
          expected = "5caa7a2dd6f8ab74ecdb358894ad23511a3dfaa8aed05ec20219225c02207e47"
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          pathlib.Path("apex-io/game.js").write_bytes(data)
          print("wrote", len(data), "bytes", got)
          PY2
          rm -rf apex-io/_fix_b64
          rm -f apex-io/_fix_game.js.zlib.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Fix Step 1 Xaman QR referrer + deep-link open handlers"
          git push
