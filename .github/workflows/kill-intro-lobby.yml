name: kill-intro-lobby
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kill-intro-lobby.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove intro; show lobby immediately
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/kill_intro_lobby.py
          python3 /tmp/kill_intro_lobby.py
          mkdir -p apex-io/_patches
          cp /tmp/kill_intro_lobby.py apex-io/_patches/kill_intro_lobby.py
          ! grep -q 'id="intro"' apex-io/index.html
          grep -q hasTestnetXaman apex-io/game.js
          grep -q cashOut apex-io/game.js
          grep -q 'src="game.js"' apex-io/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/styles.css apex-io/game.js apex-io/intro-boot.js apex-io/_patches/kill_intro_lobby.py
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Fix: remove stuck intro splash so lobby shows (Testnet untouched)"
          git push
