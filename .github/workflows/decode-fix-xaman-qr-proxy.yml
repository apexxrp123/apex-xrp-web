name: decode-fix-xaman-qr-proxy
on:
  push:
    branches: [fix-xaman-qr-proxy]
    paths:
      - "apex-io/_qr_proxy_b64/**"
      - ".github/workflows/decode-fix-xaman-qr-proxy.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-xaman-qr-proxy
      - name: Assemble decode and commit game.js
        run: |
          set -euo pipefail
          cat apex-io/_qr_proxy_b64/p*.txt > /tmp/game.b64
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib
          b = pathlib.Path("/tmp/game.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(b))
          expected = "48a19cff86ab66d8f579b81b32a23790bb864ca9ce523db973515de7fc1b7160"
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          pathlib.Path("apex-io/game.js").write_bytes(data)
          print("wrote", len(data), "bytes", got)
          PY2
          rm -rf apex-io/_qr_proxy_b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Proxy Xaman QR via den server; use normal target=_blank sign links"
          git push
