name: intro-skip-fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intro-skip-fix.yml"
      - "apex-io/intro-boot.js"
      - "apex-io/_patches/intro_skip_html.py"
      - "apex-io/_patches/intro_skip_js.py"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Intro skip + hard fail-open (Testnet untouched)
        run: |
          set -euo pipefail
          test -f apex-io/intro-boot.js
          python3 apex-io/_patches/intro_skip_html.py
          python3 apex-io/_patches/intro_skip_js.py
          grep -q 'hasTestnetXaman' apex-io/game.js
          grep -q 'cashOut' apex-io/game.js
          grep -q 'intro-boot.js' apex-io/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/styles.css apex-io/game.js apex-io/intro-boot.js
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Intro: early boot skip + hard clear in 2s; video pointer-events none (Testnet untouched)"
          git push
