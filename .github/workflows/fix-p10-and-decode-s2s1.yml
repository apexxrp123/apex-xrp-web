name: fix-p10-and-decode-s2s1
on:
  push:
    branches: [step2-slice1-network-gate]
    paths:
      - ".github/workflows/fix-p10-and-decode-s2s1.yml"
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step2-slice1-network-gate
      - name: Fix p10, decode game.js, cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib
          pathlib.Path("apex-io/_s2s1_b64/p10.txt").write_text(bytes.fromhex("").decode())
          b = "".join(pathlib.Path(f"apex-io/_s2s1_b64/p{i:02d}.txt").read_text() for i in range(1,12))
          data = zlib.decompress(base64.b64decode(b.strip()))
          expected = "a46cf35f783d68bfded3d85b78650aaf0850df546d242d4ae5dbe5f2f351f451"
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          pathlib.Path("apex-io/game.js").write_bytes(data)
          print("wrote", len(data), "bytes", got)
          PY2
          rm -rf apex-io/_s2s1_b64
          rm -f .github/workflows/fix-p10-and-decode-s2s1.yml
          rm -f .github/workflows/decode-step2-slice1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Step 2 slice 1: Testnet network gate (no Payment yet)"
          git push
