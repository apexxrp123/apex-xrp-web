name: fix-double-video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-double-video.yml"
      - "apex-io/_patches/fix_double_video.py"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 apex-io/_patches/fix_double_video.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Fix doubled </video> tag from intro-skip patch"
          git push
