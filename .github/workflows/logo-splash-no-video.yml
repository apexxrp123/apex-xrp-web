name: logo-splash-no-video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/logo-splash-no-video.yml"
      - "apex-io/_patches/logo_splash_html.py"
      - "apex-io/_patches/logo_splash_patch.py"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Strip intro; lobby loads immediately
        run: |
          set -euo pipefail
          python3 apex-io/_patches/logo_splash_html.py
          python3 apex-io/_patches/logo_splash_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/styles.css apex-io/game.js
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Remove intro entirely; lobby loads immediately"
          git push
