name: decode-kill-intro-html
on:
  push:
    branches: [main]
    paths:
      - "apex-io/_kill_intro_html_b64/**"
      - ".github/workflows/decode-kill-intro-html.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode index.html and styles.css
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib, json
          root = pathlib.Path("apex-io/_kill_intro_html_b64")
          n = int((root / "nparts.txt").read_text().strip())
          parts = []
          for i in range(n):
              parts.append((root / f"p{i:02d}.txt").read_text().strip())
          hx = "".join(parts)
          data = zlib.decompress(base64.b64decode(bytes.fromhex(hx).decode("ascii")))
          expected = (root / "sha256.txt").read_text().strip()
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          payload = json.loads(data.decode("utf-8"))
          pathlib.Path("apex-io/index.html").write_text(payload["index.html"], encoding="utf-8")
          pathlib.Path("apex-io/styles.css").write_text(payload["styles.css"], encoding="utf-8")
          print("wrote index", len(payload["index.html"]), "styles", len(payload["styles.css"]), got)
          PY2
          rm -rf apex-io/_kill_intro_html_b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Kill intro permanently: remove #intro video; CSS hide; failsafe script"
          git push
