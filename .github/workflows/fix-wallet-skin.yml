name: fix-wallet-skin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-wallet-skin.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore wallets + skin preview boot
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/fix_wallet_skin.py
          python3 /tmp/fix_wallet_skin.py
          mkdir -p apex-io/_patches
          cp /tmp/fix_wallet_skin.py apex-io/_patches/fix_wallet_skin.py
          grep -q 'Do NOT set src' apex-io/game.js
          grep -q 'renderWallets(); renderSkins(); paintPreview(); loadLobbyArt();' apex-io/game.js
          grep -q hasTestnetXaman apex-io/game.js
          grep -q cashOut apex-io/game.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/game.js apex-io/_patches/fix_wallet_skin.py
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Fix: restore Xaman wallets + skin preview after lobbyArt TDZ boot crash (Testnet untouched)"
          git push
