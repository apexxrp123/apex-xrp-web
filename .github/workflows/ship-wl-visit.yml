name: ship-wl-visit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ship-wl-visit.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add L3 whitelist + visitor counter (client only)
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_wl_visit.py
          python3 /tmp/patch_wl_visit.py
          mkdir -p apex-io/_patches
          cp /tmp/patch_wl_visit.py apex-io/_patches/patch_wl_visit.py
          grep -q maybeWhitelistAirdrop apex-io/game.js
          grep -q recordSiteVisit apex-io/game.js
          grep -q '/airdrop/whitelist' apex-io/game.js
          grep -q '/stats/visit' apex-io/game.js
          grep -q drawTxHash apex-io/game.js
          grep -q 'id="visit-count"' apex-io/index.html
          ! grep -q 'id="intro"' apex-io/index.html
          ! grep -q startApexLoop apex-io/game.js
          python3 -c "from pathlib import Path; js=Path('apex-io/game.js').read_text(); assert js.find('lobbyArt.src')>js.find('const state =')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/game.js apex-io/index.html apex-io/_patches/patch_wl_visit.py
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Client: L3 airdrop whitelist + lobby visitor counter (weekly-draw already on server)"
          git push
