name: gate-shell
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-shell.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tiny gate index + idle lobby rAF
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/gate_shell.py
          python3 /tmp/gate_shell.py
          mkdir -p apex-io/_patches
          cp /tmp/gate_shell.py apex-io/_patches/gate_shell.py
          grep -q 'app.html' apex-io/index.html
          ! grep -q 'game.js' apex-io/index.html
          grep -q 'id="arena"' apex-io/app.html
          grep -q hasTestnetXaman apex-io/game.js
          grep -q cashOut apex-io/game.js
          test $(wc -c < apex-io/index.html) -lt 2000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/app.html apex-io/game.js apex-io/styles.css apex-io/intro-boot.js apex-io/_patches/gate_shell.py
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Aw Snap: tiny gate page; load full lobby via app.html; idle lobby rAF (Testnet untouched)"
          git push
