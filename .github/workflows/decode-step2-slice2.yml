name: decode-step2-slice2
on:
  push:
    branches: [step2-slice2-jungle-lock]
    paths:
      - "apex-io/_s2s2_b64/**"
      - ".github/workflows/decode-step2-slice2.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step2-slice2-jungle-lock

      - name: Fix known chunk transcription typos
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p9 = Path("apex-io/_s2s2_b64/p09.txt")
          t = p9.read_text()
          if "FVWoupqtbw" in t and "FVWoupqrtbw" not in t:
              p9.write_text(t.replace("FVWoupqtbw", "FVWoupqrtbw", 1))
              print("fixed p09 missing r")
          p10 = Path("apex-io/_s2s2_b64/p10.txt")
          t = p10.read_text()
          if "Njwvy6todjr" in t:
              p10.write_text(t.replace("Njwvy6todjr", "Njwvy6zodjr", 1))
              print("fixed p10 t->z")
          # verify lengths
          for i in range(1, 12):
              p = Path(f"apex-io/_s2s2_b64/p{i:02d}.txt")
              if not p.exists():
                  raise SystemExit(f"missing {p}")
              print(p.name, len(p.read_text()))
          PY2
      - name: Assemble decode and commit game.js
        run: |
          set -euo pipefail
          cat apex-io/_s2s2_b64/p*.txt > /tmp/game.b64
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib
          b = pathlib.Path("/tmp/game.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(b))
          expected = "b7d8a458a21ddbc77407325e81f2078039d5cb2da75f34e8b7c349aedce5660b"
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          pathlib.Path("apex-io/game.js").write_bytes(data)
          print("wrote", len(data), "bytes", got)
          PY2
          rm -rf apex-io/_s2s2_b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Step 2 slice 2: Jungle lock Payment (1 XRP Testnet)"
          git push
