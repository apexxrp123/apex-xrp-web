name: decode-fix-csp-signin
on:
  push:
    branches: [fix-csp-xaman-signin]
    paths:
      - "apex-io/_csp_b64/**"
      - ".github/workflows/decode-fix-csp-signin.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-csp-xaman-signin
      - name: Assemble decode and commit game.js
        run: |
          set -euo pipefail
          cat apex-io/_csp_b64/p*.txt > /tmp/game.b64
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib
          b = pathlib.Path("/tmp/game.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(b))
          expected = "5d29f239f1ef36980274c42d20768256379d4cae1b76d4c345135674ab610304"
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          pathlib.Path("apex-io/game.js").write_bytes(data)
          print("wrote", len(data), "bytes", got)
          PY2
          rm -rf apex-io/_csp_b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Fix Open Xaman to https deep link (desktop)"
          git push
