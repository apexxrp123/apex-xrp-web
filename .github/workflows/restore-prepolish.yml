name: restore-prepolish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-prepolish.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore pre-Polish lobby + crash-light
        run: |
          set -euo pipefail
          GOOD=f8ef713c5161c8b0e4d4b2b5abe2f96d9f3702c7
          curl -fsSL -o apex-io/game.js "https://raw.githubusercontent.com/apexxrp123/apex-xrp-web/$GOOD/apex-io/game.js"
          curl -fsSL -o apex-io/index.html "https://raw.githubusercontent.com/apexxrp123/apex-xrp-web/$GOOD/apex-io/index.html"
          curl -fsSL -o apex-io/styles.css "https://raw.githubusercontent.com/apexxrp123/apex-xrp-web/$GOOD/apex-io/styles.css"
          echo '' | base64 -d > /tmp/restore_prepolish.py
          python3 /tmp/restore_prepolish.py
          mkdir -p apex-io/_patches
          cp /tmp/restore_prepolish.py apex-io/_patches/restore_prepolish.py
          grep -q wallet-grid apex-io/index.html
          grep -q skin-preview apex-io/index.html
          grep -q chat-form apex-io/index.html
          ! grep -q 'id="intro"' apex-io/index.html
          ! grep -q waiting-intro apex-io/index.html
          grep -q hasTestnetXaman apex-io/game.js
          grep -q cashOut apex-io/game.js
          ! grep -q startApexLoop apex-io/game.js
          ! grep -q backdrop-filter apex-io/styles.css
          python3 -c "from pathlib import Path; js=Path('apex-io/game.js').read_text(); assert js.find('lobbyArt.src')>js.find('const state =')"
          test $(wc -c < apex-io/index.html) -gt 5000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/game.js apex-io/styles.css apex-io/app.html apex-io/intro-boot.js apex-io/_patches/restore_prepolish.py
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Restore pre-Polish lobby (f8ef713) + crash-light; Testnet intact; no rebuild"
          git push
