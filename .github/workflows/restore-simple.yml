name: restore-simple
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-simple.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good lobby + Enter gate
        run: |
          set -euo pipefail
          GOOD=192e9905b9ab9ef7ce5ce42c69104822f50c552e
          curl -fsSL -o apex-io/_good_game.js "https://raw.githubusercontent.com/apexxrp123/apex-xrp-web/$GOOD/apex-io/game.js"
          curl -fsSL -o apex-io/_good_index.html "https://raw.githubusercontent.com/apexxrp123/apex-xrp-web/$GOOD/apex-io/index.html"
          curl -fsSL -o apex-io/_good_styles.css "https://raw.githubusercontent.com/apexxrp123/apex-xrp-web/$GOOD/apex-io/styles.css"
          echo '' | base64 -d > /tmp/restore_simple.py
          python3 /tmp/restore_simple.py
          mkdir -p apex-io/_patches
          cp /tmp/restore_simple.py apex-io/_patches/restore_simple.py
          # proofs
          grep -q 'app.html' apex-io/index.html
          ! grep -q 'game.js' apex-io/index.html
          ! grep -q 'id="intro"' apex-io/app.html
          grep -q 'wallet-grid' apex-io/app.html
          grep -q 'skin-preview' apex-io/app.html
          grep -q 'chat-form' apex-io/app.html
          grep -q 'treasury-in' apex-io/app.html
          grep -q hasTestnetXaman apex-io/game.js
          grep -q cashOut apex-io/game.js
          grep -q OWNER_TREASURY apex-io/game.js
          ! grep -q startApexLoop apex-io/game.js
          grep -q 'requestAnimationFrame(loop)' apex-io/game.js
          test $(wc -c < apex-io/index.html) -lt 2000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/app.html apex-io/game.js apex-io/styles.css apex-io/intro-boot.js apex-io/_patches/restore_simple.py
          git add -u apex-io/_good_game.js apex-io/_good_index.html apex-io/_good_styles.css 2>/dev/null || true
          rm -f apex-io/_good_game.js apex-io/_good_index.html apex-io/_good_styles.css
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Simple restore: known-good lobby (192e9905) behind Enter gate; Testnet intact"
          git push
