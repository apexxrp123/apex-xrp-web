name: decode-fix-cash
on:
  push:
    branches: [main]
    paths:
      - "apex-io/_fix_b64/**"
      - ".github/workflows/decode-fix-cash.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble decode and commit game.js
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import zlib, base64, hashlib, pathlib
          root = pathlib.Path("apex-io/_fix_b64")
          hex_files = sorted(root.glob("h*.txt"))
          if hex_files:
              b64 = bytes.fromhex("".join(p.read_text().strip() for p in hex_files)).decode("ascii")
          else:
              b64 = "".join(p.read_text() for p in sorted(root.glob("p*.txt"))).strip()
          data = zlib.decompress(base64.b64decode(b64))
          expected = (root / "sha256.txt").read_text().strip()
          got = hashlib.sha256(data).hexdigest()
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got} != {expected}")
          pathlib.Path("apex-io/game.js").write_bytes(data)
          print("wrote", len(data), "bytes", got)
          PY2
          rm -rf apex-io/_fix_b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Refresh balance on connect/reconnect; cashOut retry; show draw tx"
          git push
