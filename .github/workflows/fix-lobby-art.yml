name: fix-lobby-art
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-lobby-art.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix lobbyArt placement on boot
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("apex-io/game.js")
          js = p.read_text()
          bad = (
              "    renderWallets();\n"
              "  try {\n"
              "    lobbyArt.onload = () => { try { if (state.mode === \"lobby\") render(); } catch (_) {} };\n"
              "    lobbyArt.src = \"lobby-bg.jpg\";\n"
              "  } catch (_) {}\n"
          )
          if bad in js:
              js = js.replace(bad, "    renderWallets();\n", 1)
              print("removed bad onchange insert")
          good = (
              "  renderWallets();\n"
              "  try {\n"
              "    lobbyArt.onload = () => { try { if (state.mode === \"lobby\") render(); } catch (_) {} };\n"
              "    lobbyArt.src = \"lobby-bg.jpg\";\n"
              "  } catch (_) {}\n"
              "  fetch("
          )
          if good not in js:
              marker = "  renderWallets();\n  fetch("
              if marker not in js:
                  raise SystemExit("boot marker missing")
              js = js.replace(marker, good, 1)
              print("inserted boot lobbyArt")
          else:
              print("boot lobbyArt already present")
          if "renderMeta();\n    renderWallets();\n  try" in js:
              raise SystemExit("lobbyArt still on onchange")
          if good not in js:
              raise SystemExit("boot lobbyArt missing after fix")
          for s in ["hasTestnetXaman", "cashOut", "OWNER_TREASURY"]:
              if s not in js:
                  raise SystemExit("missing " + s)
          if "startApexLoop" in js:
              raise SystemExit("startApexLoop present")
          p.write_text(js)
          print("ok", len(js))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/game.js
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Fix lobbyArt load after boot renderWallets (not network onchange)"
          git push
