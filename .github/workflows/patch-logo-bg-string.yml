name: patch-logo-bg-string
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-logo-bg-string.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Swap intro error fallback lobby-bg to logo-full
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("apex-io/game.js")
          t = p.read_text(encoding="utf-8")
          old = "url(\"lobby-bg.jpg\") center / cover no-repeat"
          new = "url(\"logo-full.jpg\") center / contain no-repeat"
          # Only touch the intro onerror fallback (first occurrence after runBiteIntro)
          i = t.find("function runBiteIntro")
          if i < 0:
              raise SystemExit("runBiteIntro missing")
          j = t.find(old, i)
          if j < 0:
              if "logo-full.jpg" in t[i:i+2500]:
                  print("already logo", hashlib.sha256(t.encode()).hexdigest())
                  raise SystemExit(0)
              raise SystemExit("lobby-bg fallback not found in runBiteIntro")
          t2 = t[:j] + new + t[j+len(old):]
          # Also paint logo as soon as intro starts (before play)
          needle = "if (!wrap || !vid || TRAILER)"
          insert_at = t2.find(needle, i)
          stamp = 'try { wrap.style.background = \'#030806 url("logo-full.jpg") center / contain no-repeat\'; } catch (_) {}\n    '
          if insert_at > 0 and "logo-full.jpg") center / contain" not in t2[i:insert_at]:
              t2 = t2[:insert_at] + stamp + t2[insert_at:]
          p.write_text(t2, encoding="utf-8")
          print("ok", hashlib.sha256(t2.encode()).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/game.js
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Intro error fallback: logo-full.jpg instead of lobby-bg"
          git push
