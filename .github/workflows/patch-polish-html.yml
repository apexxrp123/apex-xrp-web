name: patch-polish-html
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-polish-html.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and styles.css
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          idx = Path("apex-io/index.html")
          t = idx.read_text()
          t = t.replace('          <button class="btn gold" id="add-funds">+25 test XRP</button>\n', '')
          if 'id="chat-toggle"' not in t:
              t = t.replace(
                  '      <div class="hud">',
                  '      <button type="button" id="chat-toggle" class="chat-toggle" aria-label="Den chat">Chat</button>\n      <div class="hud">',
                  1,
              )
          t = t.replace('<div class="card">\n        <h2>Den chat</h2>', '<div class="card card-chat">\n        <h2>Den chat</h2>', 1)
          assert 'add-funds' not in t
          assert '+25 test XRP' not in t
          assert 'id="chat-toggle"' in t
          assert 'card-chat' in t
          idx.write_text(t)
          css = Path("apex-io/styles.css")
          c = css.read_text()
          if '.chat-toggle' not in c:
              c += '''

/* polish: in-den chat on narrow */
.chat-toggle {
  display: none;
  position: absolute;
  top: calc(8px + env(safe-area-inset-top));
  right: calc(8px + env(safe-area-inset-right));
  z-index: 14;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid #e7c56a88;
  background: rgba(8, 18, 12, 0.85);
  color: #e7c56a;
  font-weight: 700;
  letter-spacing: 0.04em;
}
@media (max-width: 980px) {
  .app.playing .chat-toggle { display: block; }
  .app.playing.chat-open .side.right {
    display: flex !important;
    flex-direction: column;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: 100%;
    max-height: min(42dvh, 360px);
    z-index: 13;
    margin: 0;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    background: rgba(6, 12, 8, 0.96);
    border-top: 1px solid var(--line);
    overflow: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .app.playing.chat-open .side.right .card { display: none !important; }
  .app.playing.chat-open .side.right .card-chat {
    display: flex !important;
    flex-direction: column;
    max-height: 100%;
    margin: 0;
    padding: 8px;
  }
  .app.playing.chat-open .side.right .card-chat .chat-log {
    height: auto;
    min-height: 120px;
    max-height: 22dvh;
    flex: 1;
    font-size: 14px;
    padding: 10px;
  }
  .app.playing.chat-open .chat-toggle { background: #e7c56a; color: #2a2108; }
}
'''
          css.write_text(c)
          print("patched index+styles")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-io/index.html apex-io/styles.css
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Polish: remove +25 funds; chat-toggle; card-chat; narrow chat CSS"
          git push
